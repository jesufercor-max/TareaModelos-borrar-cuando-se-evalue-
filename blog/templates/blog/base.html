{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Gestión de Tareas{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'blog/css/estilos.css' %}">
  <script src="{% static 'blog/js/app.js' %}" defer></script>
</head>

<body>
  {% block cabecera %}
  <header class="marca">
    <img src="{% static 'blog/img/gestion-tareas.svg' %}" alt="Icono de tareas">
    <div>
      <h1>Gestión de Tareas</h1>
      <p>Aplicación de gestión de proyectos y tareas</p>
    </div>
  </header>
  {% endblock %}
  {% include 'blog/includes/navegacion.html' %}
  <main>{% block contenido %}{% endblock %}</main>
  {% include 'blog/includes/pie.html' %}
</body>

</html>
